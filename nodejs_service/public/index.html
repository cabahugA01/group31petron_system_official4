<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petron Station Management System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: linear-gradient(135deg, #b91c1c 0%, #dc2626 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: white; border-radius: 16px; padding: 40px; max-width: 500px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.2); text-align: center; }
        .logo { font-size: 48px; margin-bottom: 10px; }
        h1 { color: #b91c1c; font-size: 24px; margin-bottom: 8px; }
        .tagline { color: #666; margin-bottom: 30px; }
        .status-box { background: #f0fdf4; border: 2px solid #22c55e; border-radius: 12px; padding: 20px; margin-bottom: 25px; }
        .status-text { color: #16a34a; font-weight: bold; font-size: 18px; }
        .info { text-align: left; background: #f9fafb; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .info p { margin: 8px 0; color: #374151; }
        .info strong { color: #111; }
        .links { margin-top: 20px; }
        .links a { display: inline-block; background: #b91c1c; color: white; padding: 10px 20px; border-radius: 6px; text-decoration: none; margin: 5px; transition: 0.3s; }
        .links a:hover { background: #991b1b; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">⛽</div>
        <h1>Petron Station Management System</h1>
        <p class="tagline">Real-Time Node.js Microservice</p>

        <div class="status-box">
            <p class="status-text">● SYSTEM ONLINE</p>
            <p style="color: #666; margin-top: 5px;">Version 1.0.0</p>
        </div>

        <div class="info">
            <p><strong>Service:</strong> Node.js + Socket.IO + MySQL</p>
            <p><strong>Status:</strong> Running</p>
            <p><strong>API Health:</strong> <a href="/api/health" style="color: #b91c1c; text-decoration: none;">/api/health</a></p>
            <p><strong>Dashboard Stats:</strong> <a href="/api/stats" style="color: #b91c1c; text-decoration: none;">/api/stats</a></p>
        </div>

        <div class="links">
            <a href="/api/health">Check API Status</a>
            <a href="/api/stats">View Stats</a>
        </div>
    </div>
</body>
</html>
