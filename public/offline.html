<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline - Petron Management System</title>
  <link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css" />
  <style>
    :root {
      --petron-blue: #00264D;
      --petron-red: #CC0000;
      --bg-main: #f8f9fa;
      --bg-card: #ffffff;
      --text-main: #1e293b;
      --text-secondary: #64748b;
    }
    
    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .container {
      text-align: center;
      background: var(--bg-card);
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      max-width: 440px;
      width: 90%;
      border-top: 4px solid var(--petron-blue);
    }

    .logo-container {
      margin-bottom: 24px;
    }

    .logo {
      height: 80px;
      object-fit: contain;
    }

    .offline-icon {
      font-size: 48px;
      color: var(--petron-red);
      margin-bottom: 16px;
    }

    h1 {
      font-size: 24px;
      color: var(--petron-blue);
      margin: 0 0 10px 0;
      font-weight: 700;
    }

    p {
      font-size: 15px;
      color: var(--text-secondary);
      line-height: 1.5;
      margin: 0 0 24px 0;
    }

    .btn {
      background-color: var(--petron-blue);
      color: #ffffff;
      border: none;
      padding: 12px 30px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 38, 77, 0.2);
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .btn:hover {
      background-color: #003a75;
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-container">
      <img src="assets/img/logo.png" alt="Petron Logo" class="logo" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/e/ea/Petron_logo.svg'; this.style.height='50px';" />
    </div>
    <div class="offline-icon"><i class="fas fa-wifi"></i></div>
    <h1>Connection Lost</h1>
    <p>
      You are currently offline. Please check your network connection, Wi-Fi router, or local server connection to restore access to the Petron POS & Management System.
    </p>
    <button class="btn" onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
