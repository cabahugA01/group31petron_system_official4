<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bug Condition Exploration Test - .h1 Top Margin</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            padding: 20px;
            background: #f8fafc;
        }
        #test-results {
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
        }
        .test-case {
            margin: 10px 0;
            padding: 10px;
            border-left: 4px solid #cbd5e1;
        }
        .test-case.pass {
            border-left-color: #10b981;
            background: #f0fdf4;
        }
        .test-case.fail {
            border-left-color: #ef4444;
            background: #fef2f2;
        }
        .test-title {
            font-weight: 600;
            margin-bottom: 5px;
        }
        .test-detail {
            font-size: 14px;
            color: #64748b;
        }
        .summary {
            font-size: 18px;
            font-weight: 700;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #e2e8f0;
        }
        .summary.all-pass {
            color: #10b981;
        }
        .summary.has-fail {
            color: #ef4444;
        }
    </style>
</head>
<body>
    <h1>Bug Condition Exploration Test</h1>
    <p><strong>Property 1:</strong> Bug Condition - Zero Top Margin on .h1 Class</p>
    <p><strong>Validates:</strong> Requirements 1.1, 1.2, 1.3</p>
    <p><strong>Expected Outcome:</strong> This test MUST FAIL on unfixed code (confirming bug exists)</p>

    <!-- Test elements -->
    <div id="test-container">
        <div class="h1">Test Heading 1</div>
        <div class="h1">Test Heading 2</div>
        <div class="h1">Test Heading 3</div>
    </div>

    <div id="test-results"></div>

    <script>
        // Bug Condition Exploration Test
        // This test encodes the EXPECTED behavior (.h1 should have margin-top: 20px)
        // On UNFIXED code, this test will FAIL (confirming the bug exists)
        // On FIXED code, this test will PASS (confirming the fix works)

        const results = [];
        let totalTests = 0;
        let passedTests = 0;

        function runTest(testName, condition, expectedValue, actualValue) {
            totalTests++;
            const passed = condition;
            if (passed) passedTests++;

            results.push({
                name: testName,
                passed: passed,
                expected: expectedValue,
                actual: actualValue
            });
        }

        // Get all elements with .h1 class
        const h1Elements = document.querySelectorAll('.h1');

        console.log('=== Bug Condition Exploration Test ===');
        console.log(`Testing ${h1Elements.length} elements with .h1 class`);
        console.log('Expected behavior: .h1 should have margin-top: 20px');
        console.log('Current bug: .h1 has margin: 0 (including margin-top: 0px)');
        console.log('');

        // Test each .h1 element for proper top margin
        h1Elements.forEach((element, index) => {
            const computedStyle = getComputedStyle(element);
            const marginTop = computedStyle.marginTop;
            const marginRight = computedStyle.marginRight;
            const marginBottom = computedStyle.marginBottom;
            const marginLeft = computedStyle.marginLeft;

            console.log(`Element ${index + 1}:`);
            console.log(`  margin-top: ${marginTop} (expected: 20px)`);
            console.log(`  margin-right: ${marginRight}`);
            console.log(`  margin-bottom: ${marginBottom}`);
            console.log(`  margin-left: ${marginLeft}`);

            // CRITICAL TEST: Check if margin-top is 20px (expected behavior)
            runTest(
                `Element ${index + 1}: .h1 should have margin-top: 20px`,
                marginTop === '20px',
                '20px',
                marginTop
            );
        });

        console.log('');
        console.log(`=== Test Results: ${passedTests}/${totalTests} passed ===`);
        console.log('');

        if (passedTests < totalTests) {
            console.log('<i class="fas fa-times"></i> TEST FAILED (EXPECTED on unfixed code)');
            console.log('Counterexamples found:');
            results.filter(r => !r.passed).forEach(r => {
                console.log(`  - ${r.name}`);
                console.log(`    Expected: ${r.expected}, Got: ${r.actual}`);
            });
            console.log('');
            console.log('BUG CONFIRMED: All .h1 elements have 0px top margin instead of 20px');
            console.log('This causes cramped appearance on superadmin pages');
        } else {
            console.log('<i class="fas fa-check"></i> ALL TESTS PASSED');
            console.log('Bug fix confirmed: .h1 elements now have proper 20px top margin');
        }

        // Render results to page
        const resultsDiv = document.getElementById('test-results');
        let html = '<h2>Test Results</h2>';

        results.forEach(result => {
            html += `
                <div class="test-case ${result.passed ? 'pass' : 'fail'}">
                    <div class="test-title">${result.passed ? '<i class="fas fa-check"></i>' : '<i class="fas fa-times"></i>'} ${result.name}</div>
                    <div class="test-detail">Expected: ${result.expected}, Got: ${result.actual}</div>
                </div>
            `;
        });

        html += `
            <div class="summary ${passedTests === totalTests ? 'all-pass' : 'has-fail'}">
                ${passedTests === totalTests ? '<i class="fas fa-check"></i>' : '<i class="fas fa-times"></i>'} ${passedTests}/${totalTests} tests passed
            </div>
        `;

        if (passedTests < totalTests) {
            html += `
                <div style="margin-top: 20px; padding: 15px; background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px;">
                    <strong>Bug Confirmed:</strong> All .h1 elements have 0px top margin instead of 20px, 
                    causing cramped appearance on superadmin pages. This test will pass once the fix is implemented.
                </div>
            `;
        } else {
            html += `
                <div style="margin-top: 20px; padding: 15px; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px;">
                    <strong>Fix Verified:</strong> All .h1 elements now have proper 20px top margin as expected.
                </div>
            `;
        }

        resultsDiv.innerHTML = html;
    </script>
</body>
</html>
